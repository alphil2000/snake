<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  :root { --bg:#111; --board:#1b1b1b; --grid:#222; --snake:#60a5fa; --head:#2563eb; --food:#f87171; --text:#eee; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; user-select:none; }
  h1 { margin:0 0 8px; font-size:28px; letter-spacing:2px; }
  #hud { display:flex; gap:24px; margin-bottom:10px; font-size:16px; }
  #wrap { position:relative; }
  #game { display:block; box-shadow:0 8px 30px rgba(0,0,0,.5); background:var(--board); border-radius:8px; max-width:calc(100vw - 32px); height:auto; touch-action:none; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             background:rgba(0,0,0,.6); border-radius:8px; text-align:center; gap:8px; }
  #overlay.hidden { display:none; }
  #overlay h2 { margin:0; font-size:26px; }
  #overlay p { margin:0; opacity:.85; }
  .help { margin-top:10px; font-size:13px; opacity:.8; }
  h1, #hud, .help { text-shadow:0 1px 4px rgba(0,0,0,.8); }
  #bg { position:fixed; inset:0; width:100%; height:100%; z-index:-1; }
</style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <h1>SNAKE</h1>
  <div id="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
  <div id="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay"><h2 id="title">Snake</h2><p id="msg">Press Space / Enter or tap to start</p></div>
  </div>
  <div class="help">Arrows / WASD to move · Space to pause · Swipe on mobile</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const CELLS = 20, SIZE = canvas.width / CELLS;
const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay'), titleEl = document.getElementById('title'), msgEl = document.getElementById('msg');

let best = 0;
try { best = +localStorage.getItem('snake-best') || 0; } catch (e) {}
bestEl.textContent = best;

let boardColor = '#1b1b1b', gridColor = '#222';
let snake, dir, queue, food, score, speed, state = 'idle', timer = null;

function reset() {
  // Random dark board colour each game, dark enough to keep the snake and food visible
  const hue = Math.floor(Math.random() * 360);
  boardColor = `hsl(${hue} 35% 14%)`;
  gridColor = `hsl(${hue} 35% 19%)`;
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0};
  queue = [];
  score = 0; speed = 120;
  scoreEl.textContent = 0;
  placeFood();
}

function placeFood() {
  const free = [];
  for (let x = 0; x < CELLS; x++) for (let y = 0; y < CELLS; y++)
    if (!snake.some(s => s.x === x && s.y === y)) free.push({x, y});
  food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
}

function start() {
  if (state === 'over' || state === 'idle') reset();
  state = 'running';
  overlay.classList.add('hidden');
  loop();
}

function loop() {
  clearTimeout(timer);
  if (state !== 'running') return;
  step();
  draw();
  if (state === 'running') timer = setTimeout(loop, speed);
}

function step() {
  if (queue.length) dir = queue.shift();
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  const eating = food && head.x === food.x && head.y === food.y;
  const body = eating ? snake : snake.slice(0, -1); // tail moves away unless growing
  if (head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS ||
      body.some(s => s.x === head.x && s.y === head.y)) return gameOver();
  snake.unshift(head);
  if (eating) {
    score++;
    scoreEl.textContent = score;
    speed = Math.max(55, 120 - score * 3);
    placeFood();
    if (!food) return gameOver(true);
  } else {
    snake.pop();
  }
}

function gameOver(won) {
  state = 'over';
  if (score > best) {
    best = score; bestEl.textContent = best;
    try { localStorage.setItem('snake-best', best); } catch (e) {}
  }
  titleEl.textContent = won ? 'You win!' : 'Game over';
  msgEl.textContent = `Score: ${score} — press Space / Enter or tap to play again`;
  overlay.classList.remove('hidden');
}

function togglePause() {
  if (state === 'running') {
    state = 'paused';
    clearTimeout(timer);
    titleEl.textContent = 'Paused';
    msgEl.textContent = 'Press Space or tap to resume';
    overlay.classList.remove('hidden');
  } else if (state === 'paused') {
    state = 'running';
    overlay.classList.add('hidden');
    loop();
  }
}

function turn(nx, ny) {
  if (state !== 'running') return;
  const last = queue.length ? queue[queue.length - 1] : dir;
  if ((nx === -last.x && ny === -last.y) || (nx === last.x && ny === last.y)) return;
  if (queue.length < 3) queue.push({x:nx, y:ny});
}

function draw() {
  ctx.fillStyle = boardColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = gridColor;
  for (let i = 1; i < CELLS; i++) {
    ctx.beginPath(); ctx.moveTo(i*SIZE, 0); ctx.lineTo(i*SIZE, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*SIZE); ctx.lineTo(canvas.width, i*SIZE); ctx.stroke();
  }
  if (food) {
    ctx.fillStyle = '#f87171';
    ctx.beginPath();
    ctx.arc(food.x*SIZE + SIZE/2, food.y*SIZE + SIZE/2, SIZE/2 - 3, 0, Math.PI*2);
    ctx.fill();
  }
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#2563eb' : '#60a5fa';
    ctx.fillRect(s.x*SIZE + 1, s.y*SIZE + 1, SIZE - 2, SIZE - 2);
  });
  // eyes
  const h = snake[0], cx = h.x*SIZE + SIZE/2, cy = h.y*SIZE + SIZE/2;
  ctx.fillStyle = '#111';
  [-1, 1].forEach(k => {
    const ex = cx + dir.x*4 + dir.y*4*k, ey = cy + dir.y*4 + dir.x*4*k;
    ctx.beginPath(); ctx.arc(ex, ey, 2, 0, Math.PI*2); ctx.fill();
  });
}

const KEYS = {
  ArrowUp:[0,-1], w:[0,-1], W:[0,-1],
  ArrowDown:[0,1], s:[0,1], S:[0,1],
  ArrowLeft:[-1,0], a:[-1,0], A:[-1,0],
  ArrowRight:[1,0], d:[1,0], D:[1,0],
};
document.addEventListener('keydown', e => {
  if (KEYS[e.key]) { e.preventDefault(); turn(...KEYS[e.key]); return; }
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (state === 'running' || state === 'paused') togglePause(); else start();
  }
});

let touchStart = null;
canvas.parentElement.addEventListener('touchstart', e => {
  const t = e.touches[0]; touchStart = {x:t.clientX, y:t.clientY};
}, {passive:true});
canvas.parentElement.addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0], dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  touchStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) {
    if (state === 'running' || state === 'paused') togglePause(); else start();
    return;
  }
  if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
});
overlay.addEventListener('click', () => { if (state === 'paused') togglePause(); else if (state !== 'running') start(); });

reset();
draw();
</script>

<script>
// Animated landscape behind the board: day–night sky, sun, moon, stars, clouds, parallax mountains.
(() => {
  const bg = document.getElementById('bg');
  const g = bg.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DAY_MS = 120000;              // one full day–night cycle
  const phase0 = Math.random();       // random time of day on each visit
  const rnd = (a, b) => a + Math.random() * (b - a);
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  const rgb = (c, a = 1) => `rgba(${c.map(Math.round).join(',')},${a})`;
  const clamp = v => Math.min(1, Math.max(0, v));

  // [phase, sky top, horizon]; phase 0 = midnight, 0.25 = sunrise, 0.5 = noon, 0.75 = sunset
  const SKY = [
    [0,    [8, 12, 32],    [25, 32, 64]],
    [0.2,  [20, 28, 70],   [60, 60, 110]],
    [0.27, [60, 90, 160],  [250, 160, 100]],
    [0.35, [70, 140, 215], [170, 215, 240]],
    [0.5,  [55, 125, 240], [190, 225, 255]],
    [0.65, [70, 140, 215], [170, 215, 240]],
    [0.73, [60, 70, 140],  [245, 130, 90]],
    [0.8,  [20, 28, 70],   [60, 60, 110]],
    [1,    [8, 12, 32],    [25, 32, 64]],
  ];
  function skyAt(p) {
    let i = 0;
    while (SKY[i + 1][0] < p) i++;
    const [p0, t0, h0] = SKY[i], [p1, t1, h1] = SKY[i + 1];
    const t = (p - p0) / (p1 - p0);
    return [mix(t0, t1, t), mix(h0, h1, t)];
  }

  // Mountain ridges, far to near; each is a random mix of sine waves, so every visit gets new mountains
  const ridges = [
    { y: 0.55, amp: 0.16, speed: 4,  color: [120, 140, 180] },
    { y: 0.65, amp: 0.12, speed: 9,  color: [80, 100, 140] },
    { y: 0.75, amp: 0.08, speed: 18, color: [50, 75, 90] },
    { y: 0.86, amp: 0.05, speed: 32, color: [30, 50, 45] },
  ].map(r => {
    const waves = [1, 2.3, 5.1, 11].map(f => ({ f: f * rnd(0.8, 1.2) * 2 * Math.PI, a: rnd(0.3, 1) / f ** 0.7, ph: rnd(0, 2 * Math.PI) }));
    return { ...r, waves, norm: waves.reduce((n, w) => n + w.a, 0) };
  });
  const stars = Array.from({ length: 160 }, () => ({ x: Math.random(), y: Math.random() * 0.7, r: rnd(1, 2.2), tw: rnd(1, 3), ph: rnd(0, 6) }));
  const clouds = Array.from({ length: 7 }, () => ({ x: Math.random(), y: rnd(0.06, 0.4), s: rnd(0.6, 1.4), v: rnd(6, 16) }));
  const PUFFS = [[0, 0, 28], [30, -12, 34], [62, 0, 26], [30, 8, 30]];

  let W, H;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    bg.width = W * dpr; bg.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // Sun or moon: q runs 0 (rising, left) → 0.5 (overhead) → 1 (setting, right)
  function orb(q, r, color, glow) {
    const x = W * (0.05 + 0.9 * q), y = H * (0.8 - 0.65 * Math.sin(Math.PI * q));
    const halo = g.createRadialGradient(x, y, r * 0.5, x, y, r * 4);
    halo.addColorStop(0, rgb(color, glow));
    halo.addColorStop(1, rgb(color, 0));
    g.fillStyle = halo;
    g.fillRect(x - r * 4, y - r * 4, r * 8, r * 8);
    g.fillStyle = rgb(color);
    g.beginPath(); g.arc(x, y, r, 0, 2 * Math.PI); g.fill();
  }

  function render(now) {
    const elapsed = still ? 0 : now;
    const sec = elapsed / 1000;
    const p = (phase0 + elapsed / DAY_MS) % 1;
    const sunH = Math.sin(2 * Math.PI * (p - 0.25)); // 1 at noon, -1 at midnight
    const day = clamp(sunH * 1.5 + 0.5);
    const [top, hor] = skyAt(p);

    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, rgb(top));
    sky.addColorStop(0.75, rgb(hor));
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);

    const starA = clamp(-sunH * 2);
    if (starA > 0) for (const s of stars) {
      g.fillStyle = rgb([255, 255, 255], starA * (0.6 + 0.4 * Math.sin(sec * s.tw + s.ph)));
      g.fillRect(s.x * W, s.y * H, s.r, s.r);
    }

    orb((p - 0.25) / 0.5, 26, [255, 225, 140], 0.45);         // sun
    orb((((p + 0.5) % 1) - 0.25) / 0.5, 18, [235, 238, 255], 0.2); // moon

    g.fillStyle = rgb(mix([90, 95, 125], [255, 255, 255], day), 0.8);
    for (const c of clouds) {
      const x = ((c.x * (W + 300) + sec * c.v) % (W + 300)) - 150, y = c.y * H;
      g.beginPath();
      for (const [dx, dy, r] of PUFFS) { g.moveTo(x + (dx + r) * c.s, y + dy * c.s); g.arc(x + dx * c.s, y + dy * c.s, r * c.s, 0, 2 * Math.PI); }
      g.fill();
    }

    for (const r of ridges) {
      g.fillStyle = rgb(mix(mix(r.color, hor, 0.25), [10, 14, 30], (1 - day) * 0.75));
      g.beginPath();
      g.moveTo(0, H);
      for (let x = 0; x <= W + 8; x += 8) {
        const u = (x + sec * r.speed) / 1000;
        let h = 0;
        for (const w of r.waves) h += w.a * Math.sin(w.f * u + w.ph);
        g.lineTo(x, H * (r.y - r.amp * h / r.norm));
      }
      g.lineTo(W, H);
      g.fill();
    }
  }

  function loop(now) { render(now); requestAnimationFrame(loop); }

  resize();
  addEventListener('resize', () => { resize(); if (still) render(0); });
  if (still) render(0); else requestAnimationFrame(loop);
})();
</script>
</body>
</html>
